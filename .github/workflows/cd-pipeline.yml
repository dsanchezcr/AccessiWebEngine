name: Promote AccessiWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package and smoke-test standalone API
        run: node .github/scripts/package-api.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-screenshots-and-results
          path: test-results/playwright/
          if-no-files-found: warn
      - run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null

  staging:
    needs: validate
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: staging
    secrets: inherit

  qa:
    needs: staging
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: qa
    secrets: inherit

  prod:
    needs: qa
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: prod
    secrets: inherit
